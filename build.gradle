plugins {
    id "java-library"
    id "idea"
    id "jacoco"
    id "maven-publish"
    id "org.jreleaser" version "1.19.0"
    id "org.jetbrains.kotlin.jvm" version "2.2.10"
    id "org.jetbrains.kotlin.plugin.spring" version "2.2.10"
    id "dev.detekt" version "2.0.0-alpha.0"
    id "org.jlleitschuh.gradle.ktlint" version "12.1.0"
    id "io.spring.dependency-management" version "1.1.7"
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

java {
    withJavadocJar()
    withSourcesJar()
}

ext {
    springBootVersion = "3.5.16"
    mockkVersion = "1.14.2"
}

ext["kotlin.version"] = "2.2.10"

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:$springBootVersion"
    }
}

kotlin {
    jvmToolchain(21)
}

ktlint {
    version.set("1.5.0")
}

detekt {
    toolVersion = "2.0.0-alpha.0"
    config.setFrom(files("$rootDir/detekt.yml"))
    buildUponDefaultConfig = true
    basePath = rootDir
}

repositories {
    mavenCentral()
}

dependencies {
    api "org.springframework.boot:spring-boot-starter"
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation "org.jetbrains.kotlin:kotlin-reflect"

    testImplementation "io.mockk:mockk:${mockkVersion}"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.assertj:assertj-core"

    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named("jacocoTestReport") {
    dependsOn tasks.named("test")
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named("check") {
    dependsOn tasks.named("detektMain")
    dependsOn tasks.named("detektTest")
    dependsOn tasks.named("jacocoTestReport")
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            versionMapping {
                usage("java-api") {
                    fromResolutionOf("runtimeClasspath")
                }
                usage("java-runtime") {
                    fromResolutionResult()
                }
            }
            pom {
                name = "feature-flags"
                description = "Feature Flags implementation for Java and Spring Boot"
                url = "https://github.com/Romanow/feature-flags/"
                licenses {
                    license {
                        name = "Apache License, Version 2.0"
                        url = "https://opensource.org/license/apache-2-0"
                    }
                }
                developers {
                    developer {
                        id = "Romanow"
                        name = "Romanov Alexey"
                        email = "romanow.tech@gmail.com"
                    }
                }
                scm {
                    url = "https://github.com/Romanow/feature-flags/"
                    connection = "scm:git:https://github.com/Romanow/feature-flags.git"
                    developerConnection = "scm:git:ssh://github.com/Romanow/feature-flags.git"
                }
            }
        }
    }
    repositories {
        maven {
            name = "staging"
            url = layout.buildDirectory.dir("staging-deploy")
        }
    }
}

jreleaser {
    signing {
        active = "ALWAYS"
        armored = true
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = "ALWAYS"
                    url = "https://central.sonatype.com/api/v1/publisher"
                    stagingRepository("build/staging-deploy")
                }
            }
        }
    }
}
