style:
  VarCouldBeVal:
    active: true
    ignoreAnnotated:
      - "Autowired"
      - "Volatile"
      - "Value"
      - "Feature"
      - "MockitoBean"
      - "MockitoSpyBean"
      - "PersistenceContext"
  WildcardImport:
    active: false
  MagicNumber:
    active: false
  ThrowsCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  ReturnCount:
    active: false
  UseCheckOrError:
    active: false
coroutines:
  InjectDispatcher:
    active: false
complexity:
  TooManyFunctions:
    active: false
  LongMethod:
    active: false
  LongParameterList:
    allowedConstructorParameters: 10
    allowedFunctionParameters: 10
  CyclomaticComplexMethod:
    active: false
exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
potential-bugs:
  UnsafeCallOnNullableType:
    active: false
